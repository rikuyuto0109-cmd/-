<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英単語4択クイズ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>英単語4択クイズ</h1>

    <div id="startScreen">
        <button id="startBtn">スタート</button>
    </div>

    <div id="quizScreen" style="display:none;">

        <div class="top">
            <span id="count"></span>
            <span id="score"></span>
        </div>

        <h2 id="word"></h2>

        <div id="choices"></div>

        <p id="result"></p>

        <button id="nextBtn" style="display:none;">
            次へ
        </button>

    </div>

    <div id="finishScreen" style="display:none;">

        <h2>終了！</h2>

        <p id="finalScore"></p>

        <button onclick="location.reload()">
            もう一度挑戦
        </button>

        <button id="reviewBtn">
            間違えた問題だけ復習
        </button>

    </div>

</div>

<script src="words.js"></script>
<script src="script.js"></script>

</body>
</html>
