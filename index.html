<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>英単語マスター</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ホームボタン -->
<button id="homeBtn">🏠</button>

<div class="container">

<!-------------------------->
<!-- ホーム画面 -->
<!-------------------------->

<div id="homeScreen">

<h1>英単語マスター</h1>

<div class="homeCard">

<h2>総単語数</h2>

<p id="totalWords">0</p>

</div>

<div class="homeCard">

<h2>苦手単語</h2>

<p id="wrongCount">0</p>

</div>

<button id="startBtn" class="bigButton">
スタート
</button>

<hr>

<h2>間違えた問題一覧</h2>

<div id="wrongListBox">

<p class="empty">
まだありません
</p>

</div>

<button id="reviewStartBtn">
間違えだけ復習
</button>

<hr>

<h2>単語追加</h2>

<input
type="text"
id="newWord"
placeholder="英単語">

<input
type="text"
id="newMeaning"
placeholder="意味">

<button id="addWordBtn">

＋追加

</button>

</div>

<!-------------------------->
<!-- クイズ画面 -->
<!-------------------------->

<div id="quizScreen" style="display:none;">

<div class="top">

<span id="count"></span>

<span id="score"></span>

</div>

<h2 id="word"></h2>

<div id="choices">

</div>

<p id="result"></p>

<button id="nextBtn">

次へ

</button>

</div>

<!-------------------------->
<!-- 終了画面 -->
<!-------------------------->

<div id="finishScreen" style="display:none;">

<h1>

終了！

</h1>

<p id="finalScore"></p>

<button id="retryBtn">

もう一度挑戦

</button>

<button id="reviewBtn">

間違えだけ復習

</button>

<button id="finishHomeBtn">

ホームへ戻る

</button>

</div>

</div>

<script src="words.js"></script>

<script src="script.js"></script>

</body>

</html>
